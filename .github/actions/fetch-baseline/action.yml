name: fetch baseline ref
description: >-
  保证 <repo-path>/origin/<baseline> 存在，供 `git merge-base` 使用。

# 为什么单独一个 action：契约门禁（pr-gate-contract.sh）与静态护栏（pr-gate-guards.sh）
# **都**靠 `git merge-base origin/main HEAD` 拿基线 diff。基线拿不到时两者的行为都是
# 「退化为全量 / 跳过依赖改动清单的检查」—— 那是**安全侧**的降级，但会让门禁悄悄变弱
# 而没人发现。所以：能修就修好，修不好就明说（打 ::warning::）。

inputs:
  path:
    description: 代码仓库在工作区下的相对目录
    required: true
  baseline-ref:
    description: 基线 ref（例如 origin/main）
    required: false
    default: origin/main
  ssh-dir:
    description: >-
      取码材料目录（checkout-source 的 ssh-dir 输出）。给了就用同一把 deploy key 与
      同一份 known_hosts；留空会退回 git 的默认身份解析（仅用于本地/调试）。
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.path }}
      env:
        BASELINE_REF: ${{ inputs.baseline-ref }}
        SSH_DIR: ${{ inputs.ssh-dir }}
      run: |
        set -euo pipefail

        if git rev-parse --verify --quiet "${BASELINE_REF}" >/dev/null; then
          echo "[fetch-baseline] ${BASELINE_REF} 已存在 @ $(git rev-parse --short "${BASELINE_REF}")"
          exit 0
        fi

        # ❗ 必须与 checkout-source **同一把 key、同一份 known_hosts**。
        #    不带这个的话 git 会去翻 ssh-agent 里的所有身份 —— 在 runner 上通常什么都翻不到，
        #    但一旦翻到一把有权的 key，「deploy key 配错了」这件事就被掩盖了（CI 上随机成功/失败）。
        #    ssh-dir 由 checkout-source 输出（见其 outputs.ssh-dir 的说明）。
        if [ -n "${SSH_DIR}" ] && [ -f "${SSH_DIR}/codeup_key" ]; then
          export GIT_SSH_COMMAND="ssh -i ${SSH_DIR}/codeup_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${SSH_DIR}/known_hosts"
        else
          echo "::warning::没拿到 ssh-dir（取码材料）—— 这次 fetch 会走 git 的默认 SSH 身份解析，可能试到别的 key"
        fi

        branch="${BASELINE_REF#origin/}"
        refspec="+refs/heads/${branch}:refs/remotes/origin/${branch}"

        # 直接用 origin 的 URL 显式 fetch：不走 `git fetch origin` 的 remote 配置，
        # 免得又引入一层「remote 上配了什么」的不确定性。
        remote_url="$(git remote get-url origin)"
        if git fetch --no-tags --depth=200 "${remote_url}" "${refspec}" 2>&1; then
          :
        else
          echo "::warning::用显式 URL 取基线失败，再试一次 origin 的默认配置"
          git fetch --no-tags --depth=200 origin "${refspec}" 2>&1 || true
        fi

        if git rev-parse --verify --quiet "${BASELINE_REF}" >/dev/null; then
          echo "[fetch-baseline] 已取回 ${BASELINE_REF} @ $(git rev-parse --short "${BASELINE_REF}")"
          exit 0
        fi

        # ❗ 不静默放过：基线缺失会让「只禁新增」类检查全部失效，必须留下显式告警。
        echo "::warning::拿不到基线 ${BASELINE_REF} —— 依赖 merge-base 的分流与检查会退化为全量/跳过（安全侧，但门禁变弱，请查取码权限）"
