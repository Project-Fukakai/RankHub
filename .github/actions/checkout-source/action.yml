name: checkout Codeup source
description: >-
  用只读 SSH deploy key 从 Codeup 检出 RankHub-NET 到 <path>，并把目标 ref 解析成
  不可变的 commit SHA（annotated tag 走 ^{} 解引用）。所有下游 job 一律钉这个 SHA。

# 为什么是 composite action 而不是直接 actions/checkout：
#   * release / pr-gate 两条流水线的取码语义必须完全一致（同一条 rankhub-net 克隆，
#     同一次 ls-remote 解析）。复制粘贴两份一定会漂移。
#   * 云效版的取码是「流水线源原生检出 Codeup」，零凭据；GHA 看不到 Codeup 仓库事件，
#     只能自己取码 —— 这是本次迁移唯一新增的凭据，单独收在这里便于审计与轮换。
#
# 凭据（仓库 Secrets）：
#   CODEUP_SSH_KEY        只读 deploy key 的私钥（ED25519，公钥加到 Codeup 该仓库的「部署公钥」）
#   CODEUP_KNOWN_HOSTS    `codeup.aliyun.com` 的主机公钥行。❗ 必须用**已验证的**指纹：
#                         Codeup 官方公布 SHA256:yEGmgQNVrc3QAvDvoBrTCF2s07KwmmQ+AbWi9vSt/fE（RSA），
#                         取法：ssh-keyscan -t rsa codeup.aliyun.com | ssh-keygen -lf - 后逐字核对。
#                         刻意不在这里硬编码公钥（我没法在本地验证它，编一个等于埋雷），
#                         也不在 CI 里临时 ssh-keyscan（等于信任网络中间人，失效时静默降级）。

inputs:
  repository:
    description: Codeup 仓库的 SSH 地址
    required: true
  path:
    description: 检出到工作区下的哪个相对目录
    required: false
    default: codeup
  ref:
    description: >-
      要解析并检出的分支名 / tag 名。留空表示用仓库默认分支（仅 workflow_dispatch
      不带 ref 时会走到，正常调度一律显式传）。
    required: false
    default: ''
  ref-type:
    description: 'branch 或 tag；留空则先按分支解析、失败再按 tag 解析'
    required: false
    default: ''
  fetch-full-history:
    description: >-
      true = fetch-depth 0 + fetch-tags（变更检测要靠 `git describe --tags` 与 tag 祖先链；
      契约门禁要靠 `git merge-base`）。false = 只取目标 commit。
    required: false
    default: 'true'
  ssh-key:
    description: 只读 deploy key 的私钥
    required: true
  ssh-known-hosts:
    description: codeup.aliyun.com 的主机公钥行（已按官方指纹核对）
    required: true

outputs:
  commit:
    description: 解析出的 40 位 commit SHA
    value: ${{ steps.resolve.outputs.commit }}
  short-sha:
    description: 8 位短 SHA —— 镜像 tag `sha-<8>` 的外部契约（apply-release.sh 按它解析）
    value: ${{ steps.resolve.outputs.short_sha }}
  sha12:
    description: 12 位短 SHA —— plan.json 的 shortSha（与云效版口径一致）
    value: ${{ steps.resolve.outputs.sha12 }}
  ref-type:
    description: 实际命中的类型：branch / tag / default
    value: ${{ steps.resolve.outputs.ref_type }}
  branch-or-tag:
    description: 实际解析的 ref 名
    value: ${{ steps.resolve.outputs.branch_or_tag }}
  default-branch:
    description: 仓库默认分支名
    value: ${{ steps.resolve.outputs.default_branch }}
  ssh-dir:
    description: >-
      本次跑用到的 SSH 材料目录（私钥 + 专用 known_hosts）。下游步骤若要自己跑 git
      （例如 fetch-baseline 补基线），用这里的文件配上 GIT_SSH_COMMAND，才与取码同一口径 ——
      否则会退回「试 ssh-agent 里所有身份」，把「deploy key 配错了」掩盖掉。
    value: ${{ steps.resolve.outputs.ssh_dir }}

runs:
  using: composite
  steps:
    # —— ① 先解析 ref：拿到不可变的 commit SHA，后面的 checkout 钉死它 ——
    # 刻意**不解析 webhook payload 的 JSON 结构**：Codeup 的 webhook body 形状没有稳定契约，
    # 换成「只要 body 里带 ref 一词就能用」的自解析路径，触发器侧改字段不会弄坏流水线。
    #
    # ❗ 这一步也是**取码凭据的唯一体检点**（`ls-remote` 是第一次真实 SSH 连接）。所以：
    #   * 把私钥写到磁盘文件（`GIT_SSH_COMMAND` 需要的是文件路径；写进文件才不经过进程 argv，
    #     `/proc/*/cmdline` 看不到它）；
    #   * **不吞 stderr** —— 首跑就踩过：`2>/dev/null` 把「到底哪一步坏了」全丢了，
    #     只剩一句「凭据或 known_hosts 有问题？」。诊断信息比"好看"重要得多。
    - id: resolve
      shell: bash
      env:
        CODEUP_REPO: ${{ inputs.repository }}
        TARGET_REF: ${{ inputs.ref }}
        TARGET_REF_TYPE: ${{ inputs.ref-type }}
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        set -euo pipefail

        # —— 先做「配没配」的空值检查：这两种错误与 SSH 无关，不该混进连接报错里 ——
        if [ -z "${CODEUP_REPO}" ]; then
          echo "::error::未提供 Codeup 仓库地址（input: repository）"
          exit 1
        fi
        if [ -z "${SSH_KEY}" ]; then
          echo "::error::Secret CODEUP_SSH_KEY 是空的 —— 去 Settings → Secrets and variables → Actions 填只读 deploy key 的**私钥**（含 BEGIN/END 两行）"
          exit 1
        fi
        if [ -z "${SSH_KNOWN_HOSTS}" ]; then
          echo "::error::Secret CODEUP_KNOWN_HOSTS 是空的 —— 填 codeup.aliyun.com 的主机公钥行（见 .github/webhook-setup.md §1.3）"
          exit 1
        fi

        # —— 私钥落盘（0600），并按已知主机公钥钉死服务端身份 ——
        ssh_dir="${RUNNER_TEMP:-/tmp}/rankhub-ssh"
        mkdir -p "${ssh_dir}"
        chmod 700 "${ssh_dir}"
        printf '%s\n' "${SSH_KEY}" > "${ssh_dir}/codeup_key"
        chmod 600 "${ssh_dir}/codeup_key"
        printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${ssh_dir}/known_hosts"
        chmod 600 "${ssh_dir}/known_hosts"
        # ❗ IdentitiesOnly=yes —— 只试这一把 key，不碰 ssh-agent 里的其它身份。
        #   没有它时，agent 里恰好有一把**有权访问该仓库**的 key 会让「deploy key 配错了」
        #   这件事被掩盖（本地复现不出来、CI 上随机失败）。
        # ❗ BatchMode=yes —— 任何交互式提问（口令、首次确认主机）都直接失败而不是挂住。
        export GIT_SSH_COMMAND="ssh -i ${ssh_dir}/codeup_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${ssh_dir}/known_hosts"

        echo "[checkout-source] 探测 ${CODEUP_REPO}（key: $(ssh-keygen -lf "${ssh_dir}/codeup_key" 2>/dev/null || echo '<无法读取>')）"

        set +e
        probe="$(git ls-remote --symref "${CODEUP_REPO}" HEAD 2>&1)"
        probe_rc=$?
        set -e

        if [ "${probe_rc}" -ne 0 ]; then
          # 带 -v 再跑一次，把 SSH 的协商过程与已知主机校验结果打出来 —— 这些是
          # 「哪一步坏了」的唯一线索，且**不含密钥本身**（ssh -v 只打印算法与文件名）。
          set +e
          verbose="$(ssh -v -i "${ssh_dir}/codeup_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${ssh_dir}/known_hosts" \
            -T git@codeup.aliyun.com 2>&1 | tail -n 40)"
          set -e

          echo "::group::SSH 诊断（git ls-remote 退出码 ${probe_rc}）"
          printf '%s\n' "${probe}"
          echo "---- ssh -v ----"
          printf '%s\n' "${verbose}"
          echo "::endgroup::"

          echo "::error::从 ${CODEUP_REPO} 取码失败（退出码 ${probe_rc}）"
          case "${probe_rc}" in
            128)
              echo "::error::退出码 128 = 仓库不可读或**认证被拒**。逐条查："
              echo "  1) Codeup → RankHub-NET → 设置 →「部署公钥」里加的是 CODEUP_SSH_KEY 对应的**公钥**吗？（公钥来自 ssh-keygen 的 .pub 文件，不是私钥）"
              echo "  2) 那把公钥勾的是**只读**吗？（只读就够，本流水线从不写 Codeup）"
              echo "  3) 关键路径写成 git@codeup.aliyun.com:stcn/RankHub/RankHub-NET.git 了吗？上面的诊断里应有 'Welcome to Codeup' 或 'successfully authenticated'"
              ;;
            255)
              echo "::error::退出码 255 = **SSH 层就没连上**（还没到仓库权限那一步）。逐条查："
              echo "  1) CODEUP_KNOWN_HOSTS 是否是 codeup.aliyun.com 的 **ssh-rsa** 主机公钥行？①格式须为 '<host> ssh-rsa AAAA...'；"
              echo "     ②必须用 ssh-keygen -lf 核对过指纹 SHA256:yEGmgQNVrc3QAvDvoBrTCF2s07KwmmQ+AbWi9vSt/fE（Codeup 官方文档）"
              echo "  2) 有没有把**用户名/部署公钥**（ssh-ed25519 AAAA...）误填进来？那两样都不是主机公钥。"
              echo "  3) 上面的 ssh -v 里搜 'Host key verification failed'（known_hosts 不对）或 'Connection timed out'（网络/出站被拦）"
              ;;
            *)
              echo "::error::退出码 ${probe_rc} —— 见上方诊断输出"
              ;;
          esac
          exit 1
        fi

        default_branch="$(printf '%s\n' "${probe}" \
          | sed -n 's|^ref: refs/heads/\([^[:space:]]*\).*|\1|p' | head -n 1 || true)"
        if [ -z "${default_branch}" ]; then
          echo "::error::连通了但解析不出默认分支 —— ls-remote --symref 的输出形状变了？原文见上方诊断"
          exit 1
        fi

        if [ -z "${TARGET_REF}" ]; then
          TARGET_REF="${default_branch}"
          TARGET_REF_TYPE="branch"
        fi

        resolved=""
        resolved_type=""

        if [ "${TARGET_REF_TYPE}" != "tag" ]; then
          resolved="$(git ls-remote --exit-code "${CODEUP_REPO}" "refs/heads/${TARGET_REF}" 2>/dev/null | cut -f1 || true)"
          [ -n "${resolved}" ] && resolved_type="branch"
        fi

        if [ -z "${resolved}" ] && [ "${TARGET_REF_TYPE}" != "branch" ]; then
          # annotated tag 的 ref 指向 tag 对象，必须用 ^{} 解引用到 commit。
          # 轻量 tag 两种写法给同一个 SHA，取到即对。
          resolved="$(git ls-remote --exit-code "${CODEUP_REPO}" "refs/tags/${TARGET_REF}^{}" 2>/dev/null | cut -f1 || true)"
          if [ -z "${resolved}" ]; then
            resolved="$(git ls-remote --exit-code "${CODEUP_REPO}" "refs/tags/${TARGET_REF}" 2>/dev/null | cut -f1 || true)"
          fi
          [ -n "${resolved}" ] && resolved_type="tag"
        fi

        if [ -z "${resolved}" ]; then
          echo "::error::在 Codeup 找不到分支或 tag '${TARGET_REF}'（只按分支名 / tag 名解析，不接受任意 commit）"
          exit 1
        fi

        # ❗ 严格校验是 40 位十六进制：ls-remote 有时会把 "ref: ..." 行混进来，
        #   截断成 sha-<8> 之前必须确认拿到的真是 commit。
        if ! printf '%s' "${resolved}" | grep -qE '^[0-9a-f]{40}$'; then
          echo "::error::解析出的不是合法的 40 位 commit SHA：'${resolved}'"
          exit 1
        fi

        {
          echo "commit=${resolved}"
          # ❗ 8 位是**外部契约**：apply-release.sh 按 `sha-<8>` 找镜像（见该脚本 §553/§610
          #   的注释 —— 「回滚 up 的 IMAGE_TAG 必须取快照清单里镜像的 tag（sha-<8位>）」）。
          #   云效版用内置变量 ${CI_COMMIT_ID}（8 位）；这里显式截断，把这条契约钉在明处。
          echo "short_sha=${resolved:0:8}"
          # ❗ 12 位与 scripts/ci/plan-release.sh 的 SHORT_SHA_LEN 对齐（plan.json 的 shortSha）。
          echo "sha12=${resolved:0:12}"
          echo "ref_type=${resolved_type}"
          echo "branch_or_tag=${TARGET_REF}"
          echo "default_branch=${default_branch}"
          echo "ssh_dir=${ssh_dir}"
        } >> "${GITHUB_OUTPUT}"

        echo "[checkout-source] ref=${TARGET_REF} type=${resolved_type} commit=${resolved} short=${resolved:0:8} default=${default_branch}"

    # —— ② 检出：钉在第 ① 步解析出的 commit 上，杜绝「解析到构建之间分支又动了」 ——
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ steps.resolve.outputs.commit }}
        path: ${{ inputs.path }}
        fetch-depth: ${{ inputs.fetch-full-history == 'true' && 0 || 1 }}
        fetch-tags: ${{ inputs.fetch-full-history }}
        ssh-key: ${{ inputs.ssh-key }}
        ssh-known-hosts: ${{ inputs.ssh-known-hosts }}
        # 取码凭据只用于读：不持久化到 git config，后续步骤拿不到它。
        persist-credentials: false

    - name: sanity check
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        EXPECTED_COMMIT: ${{ steps.resolve.outputs.commit }}
        DEFAULT_BRANCH: ${{ steps.resolve.outputs.default_branch }}
      run: |
        set -euo pipefail
        actual="$(git rev-parse HEAD)"
        if [ "${actual}" != "${EXPECTED_COMMIT}" ]; then
          echo "::error::检出到的 HEAD (${actual}) 与解析出的 commit (${EXPECTED_COMMIT}) 不一致 —— 取码不可信，拒绝继续"
          exit 1
        fi
        # 契约门禁依赖 origin/<default>：actions/checkout 会建 remote refs，
        # 但显式断言一次，免得「基线悄悄没了 → 分流退化」这种安静失效。
        if ! git rev-parse --verify --quiet "origin/${DEFAULT_BRANCH}" >/dev/null; then
          echo "::warning::origin/${DEFAULT_BRANCH} 不存在 —— 依赖 merge-base 的分流会退化为全量（安全侧）"
        fi
        echo "[checkout-source] OK：工作树 $(pwd) @ ${actual}"
